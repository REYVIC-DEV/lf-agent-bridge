<!-- Smooth scroll: anchor clicks (CSS) + momentum scroll (Lenis) -->
<style>
  /* Native smooth scroll ONLY when Lenis is NOT active (mobile/touch). Lenis adds a
     `lenis` class to <html> on desktop; excluding it stops the native engine from
     fighting Lenis — the intermittent "can't reach the bottom" glitch (esp. Mac trackpads). */
  html:not(.lenis) { scroll-behavior: smooth; }
  /* keep anchored sections clear of a sticky header — adjust 80px to your header height */
  [id] { scroll-margin-top: 80px; }
  /* Lenis required CSS (normally shipped as lenis.css — it was MISSING, which let the
     native smooth-scroll rule above fight Lenis). Inlined so no extra request. */
  html.lenis, html.lenis body { height: auto; }
  /* NOTE: this Lenis build only stamps class `lenis` on <html> (never `lenis-smooth`), so
     target `html.lenis`. !important + specificity beats ANY html{scroll-behavior:smooth}
     (incl. a leftover/old style block), forcing native smooth OFF whenever Lenis runs. */
  html.lenis { scroll-behavior: auto !important; }
  html.lenis [data-lenis-prevent] { overscroll-behavior: contain; }
  html.lenis.lenis-stopped { overflow: hidden; }
</style>

<script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    // Lenis OFF on mobile/touch: its momentum scroll intermittently fails to reach the
    // page bottom on mobile (dynamic browser-bar viewport + content resizing after load).
    // Native scroll + CSS scroll-behavior:smooth handle anchor jumps fine there.
    if (window.matchMedia('(max-width: 768px), (pointer: coarse)').matches) return;
    var lenis = new Lenis({
      duration: 1.2,          // how long the ease lasts (higher = smoother/slower)
      smoothWheel: true,      // mouse wheel + trackpad
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Re-measure Lenis's max-scroll whenever the page GROWS (images without width/height
    // reflow as they load, LF-injected blocks, "Read more" expanders). Belt-and-suspenders
    // vs a stale, too-short scroll limit. rAF-debounced so it can't loop. Desktop only.
    var _rz = false;
    function resync() { if (_rz) return; _rz = true; requestAnimationFrame(function () { _rz = false; try { lenis.resize(); } catch (e) {} }); }
    window.addEventListener('load', resync);
    window.addEventListener('resize', resync);
    try { if (window.ResizeObserver) new ResizeObserver(resync).observe(document.body); } catch (e) {}
    document.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('.read-more-btn,[data-toggle],summary')) setTimeout(resync, 60); }, true);

    // let Lenis handle anchor clicks so it eases instead of jumping
    document.querySelectorAll('a[href^="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var target = document.querySelector(a.getAttribute('href'));
        if (target) { e.preventDefault(); lenis.scrollTo(target); }
      });
    });
  });
</script>

    }
    window.addEventListener("mousedown", jit, true);
    window.addEventListener("auxclick", jit, true); // middle-click new tab
    window.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") jit(e); }, true);

    // 5) Standardized cta_clicked for every OUTBOUND CTA (no preventDefault; sendBeacon survives unload)
    window.addEventListener(
      "click",
      function (e) {
        var el = e.target && e.target.closest ? e.target.closest("a[href],[data-dest]") : null;
        if (!el) return;
        var raw = el.getAttribute("data-dest") || el.getAttribute("href"); if (!raw) return;
        var url; try { url = new URL(raw, window.location.href); } catch (err) { return; }
        if (isInternal(url.hostname)) return; // skip funnel's own nav (Home/Terms/blog/etc.)
        try {
          if (typeof posthog !== "undefined" && posthog.capture) {
            // CTA position: 1-based order among OUTBOUND CTAs (top->bottom), plus how far
            // down the page the button sits (0-100). Lets the dashboard tell apart the same
            // button repeated at hero/mid/footer on a long comparison advertorial.
            var ctaPos = null, depthPct = null;
            try {
              var ctas = [].slice.call(document.querySelectorAll("a[href],[data-dest]")).filter(function (x) {
                var r = x.getAttribute("data-dest") || x.getAttribute("href"); if (!r) return false;
                var u; try { u = new URL(r, window.location.href); } catch (er) { return false; }
                return !isInternal(u.hostname); // outbound only — matches what we track
              });
              var idx = ctas.indexOf(el); if (idx >= 0) ctaPos = idx + 1;
              var rect = el.getBoundingClientRect();
              var docH = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) || 1;
              depthPct = Math.min(100, Math.max(0, Math.round(100 * (rect.top + window.scrollY) / docH)));
            } catch (ep) {}
            // Robust, recognizable CTA name (never blank) + where it came from.
            var nm = ctaName(el, url, ctaPos);
            var label = nm.name;
            posthog.capture("cta_clicked", {
              cta_text: label,
              cta_label_source: nm.src, // data-cta | aria | text | img | value | dest | position
              cta_position: ctaPos,     // 1-based order among outbound CTAs (top -> bottom)
              cta_depth_pct: depthPct,  // how far down the page the CTA sits (0-100)
              brand: (nm.src === "text" || nm.src === "aria" || nm.src === "data-cta")
                ? label.replace(/view at|from|starting at/i, "").trim() : label,
              dest: url.toString(),
              dest_host: url.hostname,
              goes_to_store: matchesShop(url.hostname),
              via: el.getAttribute("data-dest") ? "data-dest" : "href",
            }, { transport: "sendBeacon" });
            log("cta_clicked:", label, "(" + nm.src + ") #" + ctaPos, "->", url.hostname, matchesShop(url.hostname) ? "(store)" : "");
          }
        } catch (e1) {}
      },
      true
    );
  })();
</script>
