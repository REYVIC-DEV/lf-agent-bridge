      v = cleanTxt(media.getAttribute("alt") || media.getAttribute("aria-label") || media.getAttribute("title"));

      if (v) return { name: v.slice(0, 80), src: "img" };

    }

    v = cleanTxt(el.value || (el.getAttribute && el.getAttribute("value")));

    if (v) return { name: v.slice(0, 80), src: "value" };

    try {

      if (url) {

        var seg = (url.pathname || "").split("/").filter(Boolean).pop();

        if (seg) return { name: (matchesShop(url.hostname) ? "store:" : url.hostname + ":") + decodeURIComponent(seg), src: "dest" };

        if (url.hostname) return { name: url.hostname, src: "dest" };

      }

    } catch (e) {}

    return { name: "CTA #" + (pos || "?"), src: "position" };

  }



  function addParams(url) {

    for (var k in params) if (params.hasOwnProperty(k) && !url.searchParams.has(k)) url.searchParams.set(k, params[k]);

  }

  function addPhIds(url) {

    try {

      url.searchParams.set("ph_src", FUNNEL_SRC);

      if (typeof posthog === "undefined" || !posthog.get_distinct_id) return;

      var did = posthog.get_distinct_id(); if (did) url.searchParams.set("ph_distinct_id", did);

      var sid = (posthog.get_session_id ? posthog.get_session_id() : "") || "";

      if (sid) url.searchParams.set("ph_session_id", sid);

    } catch (e) {}

  }

  function applyTo(el, attr) {

    var raw = el.getAttribute(attr); if (!raw) return false;

    var url; try { url = new URL(raw, window.location.href); } catch (e) { return false; }

    var shop = matchesShop(url.hostname);

    if (!shop && !(DECORATE_ALL_OUTBOUND && !isInternal(url.hostname))) return false;

    addParams(url);

    if (shop) addPhIds(url);

    var out = url.toString();

    if (out !== raw) { el.setAttribute(attr, out); return true; }

    return false;

  }

  // Affiliate class -> URL. REPLACES the button's link (no params appended). Works

  // whether the class is on the <a> itself, on a wrapper containing an <a>, or on a

  // plain button/div (then we set data-dest so the cta_clicked handler still fires).

  function setAffHref(el, u) {

    var did = false;

    if (el.tagName === "A" || el.hasAttribute("href")) { el.setAttribute("href", u); did = true; }

    var inner = el.querySelectorAll ? el.querySelectorAll("a[href]") : [];

    for (var k = 0; k < inner.length; k++) { inner[k].setAttribute("href", u); did = true; }

    if (!did) el.setAttribute("data-dest", u);

  }

  function applyAffiliates() {

    for (var cls in AFFILIATE) {

      if (!AFFILIATE.hasOwnProperty(cls)) continue;

      var els = document.getElementsByClassName(cls);

      for (var i = 0; i < els.length; i++) setAffHref(els[i], AFFILIATE[cls]);

    }

  }



  function decorate() {

    applyAffiliates();

    var a = document.querySelectorAll("a[href]"), d = document.querySelectorAll("[data-dest]");

    for (var i = 0; i < a.length; i++) applyTo(a[i], "href");

    for (var j = 0; j < d.length; j++) applyTo(d[j], "data-dest");

  }



  decorate();

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", decorate);

  window.addEventListener("load", decorate);

  [400, 1200, 2500, 5000].forEach(function (ms) { setTimeout(decorate, ms); });

  try {

    var obs = new MutationObserver(function (m) {

      if (m.some(function (x) { return x.addedNodes && x.addedNodes.length; })) decorate();

    });

    obs.observe(document.documentElement, { childList: true, subtree: true });

    setTimeout(function () { obs.disconnect(); }, 15000);

  } catch (e) {}



  function jit(e) {

    var el = e.target && e.target.closest ? e.target.closest("a[href],[data-dest]") : null;

    if (!el) return;

    applyTo(el, "data-dest"); applyTo(el, "href");

  }

  window.addEventListener("mousedown", jit, true);

  window.addEventListener("auxclick", jit, true);

  window.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") jit(e); }, true);



  window.addEventListener("click", function (e) {

    var el = e.target && e.target.closest ? e.target.closest("a[href],[data-dest]") : null;

    if (!el) return;

    var raw = el.getAttribute("data-dest") || el.getAttribute("href"); if (!raw) return;

    var url; try { url = new URL(raw, window.location.href); } catch (err) { return; }

    if (isInternal(url.hostname)) return;

    try {

      if (typeof posthog !== "undefined" && posthog.capture) {

        // CTA position: 1-based order among OUTBOUND CTAs (top->bottom) + how far down the

        // page the button sits (0-100). Distinguishes the same button repeated hero/mid/footer.

        var ctaPos = null, depthPct = null;

        try {

          var ctas = [].slice.call(document.querySelectorAll("a[href],[data-dest]")).filter(function (x) {

            var r = x.getAttribute("data-dest") || x.getAttribute("href"); if (!r) return false;

            var u; try { u = new URL(r, window.location.href); } catch (er) { return false; }

            return !isInternal(u.hostname);

          });

          var idx = ctas.indexOf(el); if (idx >= 0) ctaPos = idx + 1;

          var rect = el.getBoundingClientRect();

          var docH = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) || 1;

          depthPct = Math.min(100, Math.max(0, Math.round(100 * (rect.top + window.scrollY) / docH)));

        } catch (ep) {}

        var nm = ctaName(el, url, ctaPos);

        posthog.capture("cta_clicked", {

          cta_text: nm.name,

          cta_label_source: nm.src, // data-cta | aria | text | img | value | dest | position

          cta_position: ctaPos,

          cta_depth_pct: depthPct,

          dest: url.toString(),

          dest_host: url.hostname,

          goes_to_store: matchesShop(url.hostname),

          via: el.getAttribute("data-dest") ? "data-dest" : "href",

          funnel_src: FUNNEL_SRC

        }, { transport: "sendBeacon" });

      }

    } catch (e1) {}

  }, true);

})();

</script>
