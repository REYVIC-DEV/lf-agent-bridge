<!-- dynamic-currency -->
<!-- ============================================================================
     DYNAMIC CURRENCY — paste into LightFunnels custom code (HEAD).
     Our product's price: .claude/skills/lightfunnels/references/PRODUCT_PRICE.md
     Converting anything else: .claude/skills/lightfunnels/references/CURRENCY_CONVERTER.md

     Two independent feeds, deliberately kept apart:

       OUR PRODUCTS  hlthtrack.com/api/prices?products=all&country=XX
                     real Shopify per-market prices for ALL 7 products.
                     Drives [data-price]. Uses the API's own `formatted`
                     string, so we never format our own money.

       COMPETITORS   app.hlthtrack.com/api/fx   mid-market FX. Drives [data-fx-gbp].
                     Indicative ONLY - Shopify checkout converts at its own rate
                     and price-list overrides ignore FX entirely. Fine for
                     "about EUR 269" on a rival's RRP; NEVER for our price.

     MULTI-PRODUCT (2026-09-21). A bare data-price still means the main band, so
     every existing page keeps working untouched. To price a DIFFERENT product,
     name its handle:

       <span data-price="price">GBP79</span>                          main band
       <span data-price="price" data-price-handle="hlth-arm-band">GBP14.95</span>

     This exists because an accessory price used to be unpriceable: it is OUR
     product so the mid-market converter must not touch it, but the feed carried
     only the band's handle so there was no exact figure either. Mid-market on
     the GBP14.95 arm band says ~PHP1,255 where Shopify charges PHP465.

     Handles: wearable-hlth-band (main, the default) · performance-band ·
     active-band · hlth-arm-band · hlth-band-lifetime-warranty ·
     hlth-band-5-year-warranty · hlth-care-plus

     Fail-safe by construction: every tagged element already contains the GBP
     text and this script only ever overwrites it. Any failure - offline, CORS,
     400, 503, unknown country, missing rate - leaves the GBP text standing.

     BOTH endpoints are origin-locked to techunboxed.co (Vary: Origin, and no
     Access-Control-Allow-Origin at all for anything else - verified 2026-09-21;
     /api/prices used to send "*" and no longer does). On the LightFunnels
     preview domain both fetches are CORS-blocked and the page correctly shows
     GBP. QA on the techunboxed URL, never the preview.
============================================================================ -->
<script>
(function () {
  "use strict";
  var PRICES = "https://hlthtrack.com/api/prices";
  var FX     = "https://app.hlthtrack.com/api/fx";
  var MAIN_HANDLE = "wearable-hlth-band";
  var DEFAULT_CC = "GB";
  var REVEAL_MS = 2500;

  var TZ_CC = {
    "Europe/London":"GB","Europe/Dublin":"IE","Europe/Berlin":"DE","Europe/Vienna":"AT",
    "Europe/Zurich":"CH","Europe/Paris":"FR","Europe/Brussels":"BE","Europe/Amsterdam":"NL",
    "Europe/Madrid":"ES","Europe/Rome":"IT","Europe/Lisbon":"PT","Europe/Stockholm":"SE",
    "Europe/Oslo":"NO","Europe/Copenhagen":"DK","Europe/Helsinki":"FI","Europe/Warsaw":"PL",
    "Europe/Prague":"CZ","Europe/Budapest":"HU","Europe/Bucharest":"RO","Europe/Athens":"GR",
    "Europe/Zagreb":"HR","Europe/Ljubljana":"SI","Europe/Bratislava":"SK","Europe/Tallinn":"EE",
    "Europe/Riga":"LV","Europe/Vilnius":"LT","Europe/Luxembourg":"LU","Europe/Malta":"MT",
    "Europe/Nicosia":"CY","Atlantic/Reykjavik":"IS",
    "America/Toronto":"CA","America/Vancouver":"CA","America/Edmonton":"CA",
    "America/Winnipeg":"CA","America/Halifax":"CA","America/St_Johns":"CA",
    "Australia/Sydney":"AU","Australia/Melbourne":"AU","Australia/Brisbane":"AU",
    "Australia/Perth":"AU","Australia/Adelaide":"AU","Pacific/Auckland":"NZ",
    "Asia/Singapore":"SG","Asia/Hong_Kong":"HK","Asia/Tokyo":"JP","Asia/Seoul":"KR",
    "Asia/Bangkok":"TH","Asia/Jakarta":"ID","Asia/Kuala_Lumpur":"MY","Asia/Manila":"PH",
    "Asia/Dubai":"AE","Asia/Riyadh":"SA","Africa/Johannesburg":"ZA",
    // AMERICAS, added 2026-09-27 when Shopify went from 32 to 38 markets.
    // Every one of the seven new markets is in the Americas, and the only
    // America/* zones here were Canada's - so a US, Mexican or Brazilian
    // visitor auto-detected as GB and was quoted POUNDS on a page that had a
    // real local price waiting for them. Ecuador had the same gap since launch.
    "America/New_York":"US","America/Detroit":"US","America/Chicago":"US",
    "America/Menominee":"US","America/Denver":"US","America/Boise":"US","America/Phoenix":"US",
    "America/Los_Angeles":"US","America/Anchorage":"US","America/Juneau":"US",
    "America/Sitka":"US","America/Nome":"US","America/Yakutat":"US","America/Metlakatla":"US",
    "America/Adak":"US","Pacific/Honolulu":"US",
    "America/Mexico_City":"MX","America/Cancun":"MX","America/Merida":"MX",
    "America/Monterrey":"MX","America/Matamoros":"MX","America/Chihuahua":"MX",
    "America/Ciudad_Juarez":"MX","America/Ojinaga":"MX","America/Mazatlan":"MX",
    "America/Bahia_Banderas":"MX","America/Hermosillo":"MX","America/Tijuana":"MX",
    "America/Sao_Paulo":"BR","America/Bahia":"BR","America/Fortaleza":"BR",
    "America/Recife":"BR","America/Maceio":"BR","America/Araguaina":"BR","America/Belem":"BR",
    "America/Santarem":"BR","America/Manaus":"BR","America/Boa_Vista":"BR",
    "America/Porto_Velho":"BR","America/Rio_Branco":"BR","America/Eirunepe":"BR",
    "America/Cuiaba":"BR","America/Campo_Grande":"BR","America/Noronha":"BR",
    "America/Argentina/Buenos_Aires":"AR",
    "America/Santiago":"CL","America/Punta_Arenas":"CL","Pacific/Easter":"CL",
    "America/Bogota":"CO",
    "America/Lima":"PE",
    "America/Guayaquil":"EC","Pacific/Galapagos":"EC"
  };

  // Zone FAMILIES, so the map does not need a row per sub-zone. Argentina alone
  // has a dozen (America/Argentina/Cordoba, /Mendoza, /Salta ...) and the US
  // three more families; listing them individually is a maintenance trap where
  // one missing row silently quotes pounds to a whole province.
  var TZ_PREFIX = [
    ["America/Argentina/", "AR"], ["America/Indiana/", "US"],
    ["America/Kentucky/", "US"],  ["America/North_Dakota/", "US"]
  ];

  function pickCountry() {
    try {
      var q = new URLSearchParams(location.search).get("country");
      if (q && /^[A-Za-z]{2}$/.test(q)) return q.toUpperCase();
    } catch (e) {}
    try {
      var tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone;
      if (tz) {
        if (TZ_CC[tz]) return TZ_CC[tz];
        for (var i = 0; i < TZ_PREFIX.length; i++) {
          if (tz.indexOf(TZ_PREFIX[i][0]) === 0) return TZ_PREFIX[i][1];
        }
      }
    } catch (e) {}
    return DEFAULT_CC;
  }
  var CC = pickCountry();

  // Only hide when we might actually change something: a GB visitor already
  // sees the right text, so give them no flash at all.
  var hiding = CC !== DEFAULT_CC;
  var styleEl = null;
  if (hiding) {
    styleEl = document.createElement("style");
    styleEl.textContent = "[data-price],[data-fx-gbp]{visibility:hidden}";
    (document.head || document.documentElement).appendChild(styleEl);
  }
  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    if (styleEl && styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
  }
  setTimeout(reveal, REVEAL_MS);
  if (hiding) window.addEventListener("error", reveal);

  // Trailing ".00" costs 3 characters and carries no information. The
  // comparison table gives a price cell 44px on a 390px screen, where
  // "~EUR268.00" overran its column by ~21px and collided with the cell
  // beside it. Trimming restores our own price to the "79" width the design
  // was built around, and leaves a genuinely fractional price (HR 60.65)
  // alone. Handles "268.00" and the de-DE "268,00 EUR" ordering both.
  function trimZeros(t) {
    return typeof t === "string" ? t.replace(/([.,])00(?=[^0-9]*$)/, "") : t;
  }

  function fmt(n, cur) {
    if (!isFinite(n) || n <= 0) return null;   // a 0 renders a free product
    try {
      return trimZeros(new Intl.NumberFormat(navigator.language || "en-GB",
        { style: "currency", currency: cur, maximumFractionDigits: 2 }).format(n));
    } catch (e) { return null; }
  }

  // products=all answers { products: [ { handle, multiPriced, markets: [...] } ] }
  // - a DIFFERENT shape from the single-product response, which is
  // { handle, title, markets, byCurrency }. Country-filtered, so each product
  // carries at most one market, but filter by country anyway rather than
  // trusting index 0.
  function marketOf(product, cc) {
    var mk = (product && product.markets) || [], i;
    for (i = 0; i < mk.length; i++) if (mk[i].country === cc) return mk[i];
    return null;
  }

  function applyPrices(data) {
    var products = (data && data.products) || [];
    var byHandle = {}, i, mainMarket = null, anyCurrency = null;
    for (i = 0; i < products.length; i++) byHandle[products[i].handle] = products[i];

    var els = document.querySelectorAll("[data-price]"), el, handle, kind, p, m;
    for (i = 0; i < els.length; i++) {
      el = els[i];
      handle = el.getAttribute("data-price-handle") || MAIN_HANDLE;
      kind = el.getAttribute("data-price");
      p = byHandle[handle];
      if (!p) continue;                       // unknown handle -> keep GBP
      m = marketOf(p, CC);
      if (!m || m.available === false) continue;   // not sold here -> keep GBP
      if (!anyCurrency) anyCurrency = m.currency;
      if (handle === MAIN_HANDLE) mainMarket = m;

      // multiPriced means the variants disagree and `amount` is the CHEAPEST,
      // so it is a "from" price. Care+ is GBP7.95 monthly and GBP79.95 for the
      // year: writing the cheapest as if it were THE price understates the
      // annual plan tenfold. Refuse unless the markup opts in by carrying
      // data-price-from, which is the page promising its copy says "from".
      // Failing to localise is recoverable; quoting a tenth of the price is not.
      if (p.multiPriced && kind === "price" && !el.hasAttribute("data-price-from")) {
        continue;
      }

      var amount = parseFloat(m.amount), compare = parseFloat(m.compareAt), out = null;
      if (kind === "price") {
        out = trimZeros(m.formatted);
      } else if (kind === "compare") {
        out = isFinite(compare) ? fmt(compare, m.currency) : null;
      } else if (kind === "savings") {
        // COMPUTED, not assumed: savings only equals the price while every
        // market sits at exactly 50% off, which is true today and is not a
        // promise.
        out = (isFinite(compare) && isFinite(amount) && compare > amount)
          ? fmt(compare - amount, m.currency) : null;
      } else if (kind === "discount") {
        out = m.discountPct ? m.discountPct + "%" : null;
      }
      if (out != null && out !== "") el.textContent = out;
    }
    return mainMarket || (anyCurrency ? { currency: anyCurrency } : null);
  }

  function applyFx(fxData, cur) {
    if (!fxData || !fxData.rates || !cur || cur === "GBP") return;
    var rate = fxData.rates[cur];
    // A currency with no rate is OMITTED by the API, never sent as 0 or null.
    // undefined would give NaN and a 0 would render a free product - bail.
    if (typeof rate !== "number" || !isFinite(rate) || rate <= 0) return;
    var els = document.querySelectorAll("[data-fx-gbp]"), i, gbp, out;
    for (i = 0; i < els.length; i++) {
      gbp = parseFloat(els[i].getAttribute("data-fx-gbp"));
      if (!isFinite(gbp) || gbp < 0) continue;
      if (gbp === 0) {
        // A "GBP0" subscription cell means "none". It still has to change
        // currency or the row reads "EUR79 / GBP0 / EUR79", and it takes no
        // "~" because there is nothing approximate about zero. Formatted
        // directly rather than through fmt(), whose <= 0 guard must stay in
        // force for data-price, where a 0 would render a free product.
        out = null;
        try {
          out = new Intl.NumberFormat(navigator.language || "en-GB",
            { style: "currency", currency: cur,
              maximumFractionDigits: 0 }).format(0);
        } catch (e) { out = null; }
        if (out) els[i].textContent = out;
        continue;
      }
      out = fmt(Math.round(gbp * rate), cur);   // whole units: it is indicative
      // No "~" prefix: removed deliberately on request 2026-08-25. These are
      // still MID-MARKET conversions of GBP figures, so they are indicative and
      // will not match what a rival actually charges locally - the figure now
      // simply does not say so. Rounding to whole units is the only remaining
      // signal. Restore the prefix here if that ever needs stating again.
      if (out) els[i].textContent = out;
    }
  }

  function getJSON(url) {
    return fetch(url, { mode: "cors", credentials: "omit" }).then(function (r) {
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    });
  }

  function run() {
    // country-scoped: ~6 KB instead of the ~165 KB all-markets payload, and it
    // costs the API the same either way (@inContext forces one upstream call
    // per COUNTRY, not per product).
    // A country Shopify does not sell to answers 400 "unknown market" - e.g.
    // US. That is normal, not an outage: it throws, the catch reveals, and
    // every figure keeps its GBP text.
    var url = PRICES + "?products=all&country=" + encodeURIComponent(CC);
    getJSON(url).then(function (p) {
      var m = applyPrices(p);
      var cur = m && m.currency;
      if (window.posthog && typeof posthog.register === "function") {
        try { posthog.register({ funnel_country: CC, funnel_currency: cur || "GBP" }); } catch (e) {}
      }
      reveal();
      // Only reach for FX if a competitor figure actually exists on the page.
      // Skipping it saves a cross-origin request on every non-GB pageview, and
      // avoids a console CORS error on domains /api/fx does not allow.
      var wantFx = document.querySelector("[data-fx-gbp]");
      if (wantFx && cur && cur !== "GBP") {
        // competitors are a separate, weaker feed - its failure must not undo
        // the product price already applied
        return getJSON(FX).then(function (f) { applyFx(f, cur); }).catch(function () {});
      }
    }).catch(function () { reveal(); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else { run(); }
})();
</script>
